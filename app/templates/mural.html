{% extends "base.html" %}
{% block content %}
  <h2>Recados</h2>

  {% if user %}
    <form method="post" class="card">
      <label>Novo recado
        <textarea name="content" rows="3" placeholder="Escreva algo..."></textarea>
      </label>
      <button type="submit">Publicar</button>
    </form>
  {% else %}
    <p class="dica"><a href="{{ url_for('login') }}">Entre</a> para publicar um recado.</p>
  {% endif %}

  <ul class="recados">
    {% for c in comments %}
      <li class="card">
        <span class="autor">{{ c.author }}</span>
        {# [VULNERAVEL] O filtro |safe desliga o escape automatico do Jinja2.
           Um recado com <script> e renderizado como HTML e EXECUTA no navegador. #}
        <p>{{ c.content|safe }}</p>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
